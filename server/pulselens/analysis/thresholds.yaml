# PROVISIONAL values, used only until G9 calibrates them on set A genuine sessions (thresholds.calibrated.yaml).
# They are physics-based guesses and the old repo's bootstrap values, not measurements: every result that uses them
# carries threshold_source "provisional", and the console shows PROVISIONAL THRESHOLDS.
# `voting: false` on a check makes its `flag` always false (measured, not voting; set at S3).

quality:
  min_fps: 12
  min_face_present: 0.8
  luma: [40, 220]            # face mean luma, sRGB 0..255
  min_luma_ok: 0.8           # share of face frames inside the luma range
  min_neck_coverage: 0.5
  max_motion: 0.5            # face widths per second (not for the turn window)
  saturation: 0.95           # linear channel mean above which a region counts as clipped
  max_saturated: 0.2         # share of face frames with the face or neck clipped

echo:
  a_min: 0.003               # smallest projection on the colour direction (chromaticity units) that counts as an echo
  delay_band_ms: [0, 300]

light.response:
  flag_at: 0.5               # fewer than half the steps answered
  min_steps: 4
  min_cosine: 0.5            # measured vs expected colour direction
  max_silent_threshold: 0.012  # 4x echo.a_min: a step with no echo whose 4-sigma threshold is above this cannot
                               # be called silent (unclear). A guess: check against real bright-room webcams at S2
  faint_echo_z: 2.5          # steps without an echo, pooled: a mean push towards the colours of >= this many
                             # standard errors means a faint echo (unclear), not silence (issue #17)
  order_min_snr: 2.0         # a colour change must reach this x its threshold before a wrong direction counts

light.face_neck:
  flag_at: 0.5
  min_pairs: 3
  min_snr: 2.0
  ratio_log_tolerance: 1.386 # ln 4: skin and shirt reflect differently, so up to 4x either way scores nothing
  ratio_log_scale: 0.693     # ln 2 per score unit beyond that
  neck_only_steps: 2
  faint_z: 3.0               # a face whose mean change over a step pushes towards the colour by >= this many standard
                             # errors answered faintly: not silent, so not neck-only (issue #17)

light.background:
  flag_at: 0.5
  max_bg_ratio: 0.8          # background colour change / face colour change; risk = 0.5 x ratio / this
  min_steps: 3               # steps with a clear face echo
  min_coverage: 0.2          # share of the frame left as background

sensor.cadence:
  flag_at: 0.6
  max_gap_ms: 1000
  min_frames: 30
  too_regular_share: 0.98    # share of intervals within 0.5 ms of the median ...
  too_regular_cv: 0.01       # ... and interval spread below this: a perfect clock (hypothesis, measure at S2)

sensor.duplicates:
  flag_at: 1.0
  max_share: 0.05
  min_frames: 30
  max_hamming: 2             # dHash bits
  max_mad: 0.5               # mean abs difference, 0..255, on a [::8] pixel grid

sensor.mode_probe:
  flag_at: 0.7
  max_switch_ms: 150         # the unusual mode delivered faster than this, with no missing frame: too perfect
  unusual_size: [1000, 750]  # the mode real webcams rarely offer (Yash's PROBE_MODES)

sensor.regions:
  flag_at: 0.5
  ratio_log_tolerance: 0.916 # ln 2.5: face noise within 2.5x of the neck's and background's scores nothing
  ratio_log_scale: 0.693     # ln 2 per score unit beyond that
  min_frames: 20             # still frames with a face

sensor.prnu:
  flag_at: 1.0
  min_pce: 50
  voting: false              # supporting only

turn.follow:
  flag_at: 0.5
  min_peak_deg: 15
  max_return_deg: 10
  still_deg: 10              # below this either way the head did not move; above it towards the side = the start
  max_face_lost: 0.4         # share of the turn window without a face before turn.face_lost
  face_lost_risk: 0.6        # a hypothesis (swaps drop the face at large angles); one family -> a retry
  too_fast_ms: 150           # noted, not scored
  baseline_ms: 500           # yaw0 = median yaw over this long before the prompt
  tail_ms: 500               # the window runs to ended + this
  return_window_ms: 300      # return_deg = median |yaw - yaw0| over the window's last 300 ms

turn.identity:
  flag_at: 0.5
  max_change: 0.15

visual.sbi:
  flag_at: 0.5

pulse.coherence:
  flag_at: 1.0
  voting: false              # logged only
